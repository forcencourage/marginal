<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Marginal — Reader</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,450;9..144,500;9..144,600&family=Inter:wght@400;500;560;650&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="reader-header">
  <div class="left">
    <a href="index.html" class="back-link" aria-label="Back to library">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </a>
    <button class="icon-btn panel-toggle" id="panel-toggle" aria-label="Show highlights" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h10"/></svg>
    </button>
    <div class="reader-titles">
      <h1 id="book-title">Loading…</h1>
      <p id="book-author">&nbsp;</p>
    </div>
  </div>
  <div class="right">
    <span class="progress-pill" id="progress-pill">—</span>
    <button class="icon-btn" id="delete-book" aria-label="Delete this book" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
    </button>
  </div>
</header>

<div class="reader-layout">
  <div class="panel-scrim" id="panel-scrim"></div>

  <aside class="highlights-panel" id="highlights-panel">
    <div class="panel-heading">
      <h2>Highlights</h2>
      <span id="highlight-count">0</span>
    </div>
    <div class="highlight-list" id="highlight-list">
      <p class="highlight-empty" id="highlight-empty">
        Select any text in the book to save it here — it's highlighted in the
        page and stored to your library instantly.
      </p>
    </div>
  </aside>

  <section class="reading-pane">
    <div id="viewer"></div>
    <div class="reader-loading" id="reader-loading">
      <span class="spinner"></span>
      <span>Opening book…</span>
    </div>
    <div class="selection-toast" id="selection-toast">
      <span class="dot"></span>
      <span>Highlight saved</span>
    </div>
    <div class="confirm-bar" id="confirm-bar">
      <span class="confirm-text" id="confirm-text">Highlight this selection?</span>
      <div class="confirm-actions">
        <button class="btn btn-ghost btn-sm" id="confirm-cancel" type="button">Cancel</button>
        <button class="btn btn-sm" id="confirm-save" type="button">Highlight</button>
      </div>
    </div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>
<script type="module" src="js/reader.js"></script>
</body>
</html>
