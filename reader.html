<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Marginal — Reader</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,450;9..144,500;9..144,600&family=Inter:wght@400;500;560;650&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="alternate icon" href="favicon.ico" />
</head>
<body class="reader-page">

<header class="reader-header">
  <div class="left">
    <a href="index.html" class="back-link" id="back-link" aria-label="Back to library">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </a>
    <div class="reader-titles">
      <h1 id="book-title">Loading…</h1>
      <p id="book-author">&nbsp;</p>
    </div>
  </div>
  <div class="right">
    <button class="icon-btn" id="search-toggle" aria-label="Search in book" title="Search (Ctrl/⌘ + F)" aria-controls="search-bar" aria-expanded="false" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    </button>
    <button class="icon-btn" id="panel-toggle" aria-label="Highlights" aria-haspopup="true" aria-expanded="false" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 11-6 6v3h9l3-3"/><path d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"/></svg>
    </button>
    <button class="icon-btn" id="toc-toggle" aria-label="Table of contents" aria-haspopup="true" aria-expanded="false" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/></svg>
    </button>
  </div>

  <div class="search-bar" id="search-bar" role="search" hidden>
    <div class="search-field">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input class="search-input" id="search-input" type="text" inputmode="search" enterkeyhint="search"
            placeholder="Search a word or expression" aria-label="Search in this book"
            autocomplete="off" autocapitalize="off" spellcheck="false" />
      <span class="spinner search-spinner" id="search-spinner" hidden></span>
      <span class="search-count" id="search-count" aria-live="polite"></span>
      <button class="search-clear" id="search-clear" type="button" aria-label="Clear search" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
    <div class="search-nav">
      <button class="icon-btn" id="search-prev" type="button" aria-label="Previous occurrence" title="Previous (Shift+Enter)" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg>
      </button>
      <button class="icon-btn" id="search-next" type="button" aria-label="Next occurrence" title="Next (Enter)" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
      </button>
    </div>
    <button class="icon-btn" id="search-close" type="button" aria-label="Close search" title="Close (Esc)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    </button>
  </div>

</header>

<div class="reader-layout">
  <div class="panel-scrim" id="panel-scrim"></div>

  <aside class="highlights-panel" id="highlights-panel" aria-label="Highlights">
    <div class="panel-heading">
      <div class="panel-title">
        <h2>Highlights</h2>
        <span id="highlight-count">0</span>
      </div>
      <button class="icon-btn panel-close" id="panel-close" aria-label="Close highlights" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
    <div class="highlight-list" id="highlight-list">
      <p class="highlight-empty" id="highlight-empty">
        Select any text in the book to save it here — it's highlighted in the
        page and stored to your library instantly.
      </p>
    </div>
  </aside>

  <div class="panel-scrim" id="toc-scrim"></div>

  <aside class="toc-panel" id="toc-panel">
    <div class="panel-heading">
      <h2>Contents</h2>
      <button class="icon-btn panel-close" id="toc-close" aria-label="Close table of contents" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
    <nav class="toc-list" id="toc-list" aria-label="Table of contents">
      <p class="toc-empty" id="toc-empty">Loading contents…</p>
    </nav>
    <div class="toc-footer">
      <button class="btn-text btn-danger-text" id="delete-book" type="button">Delete this book</button>
    </div>
  </aside>

  <section class="reading-pane">
    <div id="viewer"></div>
    <div class="reader-loading" id="reader-loading">
      <span class="spinner"></span>
      <span>Opening book…</span>
    </div>
    <div class="selection-toast" id="selection-toast">
      <span class="dot"></span>
      <span>Highlight saved</span>
    </div>
    <div class="confirm-bar" id="confirm-bar">
      <span class="confirm-text" id="confirm-text">Highlight this selection?</span>
      <div class="confirm-actions">
        <button class="btn btn-ghost btn-sm" id="confirm-cancel" type="button">Cancel</button>
        <button class="btn btn-sm" id="confirm-save" type="button">Highlight</button>
      </div>
    </div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>
<script type="module" src="js/reader.js"></script>
</body>
</html>
